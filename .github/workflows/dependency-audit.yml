name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        continue-on-error: false
        # PYSEC-2024-271 (flask-cors): CRLF log-injection only when Flask
        # debug logging is enabled. Production runs with DEBUG=false and
        # the upstream advisory lists no fix version, so this finding is
        # acknowledged and explicitly ignored to unblock CI. Revisit when
        # flask-cors ships a fixed release.
        run: pip-audit -r backend/requirements.txt --desc on --ignore-vuln PYSEC-2024-271

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Audit frontend dependencies
        continue-on-error: false
        run: cd frontend && npm audit --audit-level=high
