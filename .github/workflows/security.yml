name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'OPENCODE.md'
      - 'MEMORY.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3571e89c1b5abe9d55 # v4.5.0
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0, AGPL-3.0

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --format json --output backend-audit.json || true

      - name: Audit crawler dependencies
        run: |
          if [ -f crawlers/youtube/requirements.txt ]; then
            pip-audit -r crawlers/youtube/requirements.txt --format json --output crawlers-audit.json || true
          fi

      - name: Check audit results
        run: |
          echo "=== Backend Audit ==="
          cat backend-audit.json 2>/dev/null || echo "No results"
          echo ""
          echo "=== Crawler Audit ==="
          cat crawlers-audit.json 2>/dev/null || echo "No results"

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
