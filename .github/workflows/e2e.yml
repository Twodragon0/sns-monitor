name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare env
        run: |
          cp .env.example .env
          echo "YOUTUBE_API_KEY=test_key" >> .env

      - name: Start stack
        run: docker compose up -d --build api-backend frontend redis

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3080/ > /dev/null \
               && curl -fsS http://localhost:8888/api/health > /dev/null; then
              echo "Services ready"
              exit 0
            fi
            echo "Waiting ($i/60)..."
            sleep 2
          done
          echo "Services did not become ready in time"
          docker compose logs --tail=200
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --tail=500

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/test-results
          retention-days: 7

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
